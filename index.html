<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Video Pages</title>
<style>
html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

#page {
    width:8in;
    height:9in;
    position:relative;
    background:black;
    overflow:hidden;
    user-select:none;
}

#videoContainer {
    position:absolute;
    inset:0;
    z-index:1;
}

video {
    width:100%;
    height:100%;
    object-fit:cover;
    background:black;
    transition:transform 0.5s ease;
}

#overlay {
    position:absolute;
    inset:0;
    background:black;
    color:white;
    font-size:32px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    z-index:20;
}

#pageNumber {
    position:absolute;
    bottom:5px;
    right:10px;
    color:black;
    font-size:28px;
    opacity:0.8;
    z-index:25;
    pointer-events:none;
}

/* Play Bar */
#playBar {
    position:absolute;
    bottom:56px;
    left:18px;
    width:calc(100% - 90px);
    z-index:30;
    appearance:none;
    height:4px;
    border-radius:3px;
    background:#444;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.3s ease;
}

#playBar::-webkit-slider-runnable-track {
    height:4px;
    background:#444;
    border-radius:3px;
}

#playBar::-webkit-slider-thumb {
    appearance:none;
    width:16px;
    height:16px;
    border-radius:50%;
    background:white;
    margin-top:-6px;
}

/* Playback speed button */
#snailBtn {
    position:absolute;
    right:18px;
    bottom:120px;
    width:52px;
    padding:3px 0;
    border:0;
    border-radius:10px;
    background:rgba(0,0,0,0.55);
    color:white;
    font-size:42px;
    line-height:1.1;
    cursor:pointer;
    z-index:35;
    user-select:none;
    touch-action:manipulation;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.3s ease;
}
#snailBtn .speed-label {
    display:block;
    font: bold 12px Arial, sans-serif;
    margin-top:3px;
}
#snailBtn[aria-pressed="true"] {
    background:rgba(255,193,7,0.85);
    color:black;
}
#snailBtn:focus-visible {
    outline:2px solid white;
    outline-offset:3px;
}

/* Heart Button */
#heartBtn {
    position:absolute;
    right:18px;
    bottom:56px;
    font-size:42px;
    cursor:pointer;
    z-index:35;
    user-select:none;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.3s ease;
}

.heart-pulse {
    animation:heartPulse 0.4s ease-in-out;
}

@keyframes heartPulse {
    0% { transform:scale(1); }
    50% { transform:scale(1.35); }
    100% { transform:scale(1); }
}
</style>
</head>
<body>
<div id="page">

    <div id="videoContainer">
        <video id="video" muted preload="auto" playsinline></video>
    </div>

    <div id="overlay">Click to Start</div>
    <div id="pageNumber">1 / 24</div>
    <div id="playbackError" role="status" style="display:none;position:absolute;top:16px;left:16px;right:16px;padding:12px;background:rgba(0,0,0,0.8);color:white;font:16px Arial,sans-serif;z-index:40;pointer-events:none"></div>

    <input type="range" id="playBar" min="0" max="100" value="0">
    <button type="button" id="snailBtn" aria-label="Speed: 100%. Click for 50%." aria-pressed="false" title="Speed: 100%. Click for 50%."><span aria-hidden="true">🐌</span><span class="speed-label" aria-hidden="true">100%</span></button>
    <div id="heartBtn">❤️</div>

</div>

<script>
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const page = document.getElementById("page");
const pageNumber = document.getElementById("pageNumber");
const playBar = document.getElementById("playBar");
const heartBtn = document.getElementById("heartBtn");

/* Each line is one student step. List multiple clips on a line to
   play them as one continuous step. Times are seconds within each file. */
const pages = [
    // VIDEO 1 - original pages 1-2
    [{ src:"video1.mp4", start:0,  end:9  }],
    [{ src:"video1.mp4", start:13,  end:29 }],
    [{ src:"video1.mp4", start:32,  end:66  }],
    [{ src:"video1.mp4", start:73,  end:106 }],
    [{ src:"video1.mp4", start:140,  end:156 }],
    [{ src:"video1.mp4", start:156,  end:212 }],
    [{ src:"video1.mp4", start:212,  end:289 }],
    [{ src:"video1.mp4", start:289,  end:323 }],

    // VIDEO 2 - original pages 3-4, starting at original time 33
    [{ src:"video2.mp4", start:0,  end:46 }],
    [{ src:"video2.mp4", start:48, end:93 }],
    [{ src:"video2.mp4", start:96,  end:195 }],
    [{ src:"video2.mp4", start:198, end:324 },{ src:"video3.mp4", start:0,  end:98 }],
    [{ src:"video3.mp4", start:98, end:130 }],
    [{ src:"video3.mp4", start:148,  end:190 }],
    [{ src:"video3.mp4", start:196, end:319 }],

    // VIDEO 4 - original pages 7-8, starting at original time 120
    [{ src:"video4.mp4", start:0,  end:60 }],
    [{ src:"video4.mp4", start:63, end:70 }],
    [{ src:"video4.mp4", start:75,  end:236 }],
    [{ src:"video4.mp4", start:310, end:331 }],
   
    // VIDEO 5 - original pages 9-10, starting at original time 189
    [{ src:"video5.mp4", start:0,  end:153 }],

    // VIDEO 6 - original pages 11-12, starting at original time 260
    [{ src:"video6.mp4", start:6,  end:23  }],
    [{ src:"video6.mp4", start:23, end:129 }],
    [{ src:"video6.mp4", start:135,  end:193  }],
    [{ src:"video7.mp4", start:0,  end:17  }],
];

let currentPage = 0;
let currentSrc = "";
let started = false;
let startY = null;
let scrubbing = false;
let loadRequest = 0;
let currentClip = 0;
let loadingClip = false;

function waitForVideoReady(){
    if(video.error) return Promise.reject(new Error(`Could not load ${currentSrc}. Keep the MP4 files in the same folder as this HTML file.`));
    if(video.readyState >= 1) return Promise.resolve();
    return new Promise((resolve, reject) => {
        const cleanup = () => {
            video.removeEventListener("loadedmetadata", onReady);
            video.removeEventListener("error", onError);
        };
        const onReady = () => { cleanup(); resolve(); };
        const onError = () => {
            cleanup();
            reject(new Error(`Could not load ${currentSrc}. Keep the MP4 files in the same folder as this HTML file.`));
        };
        video.addEventListener("loadedmetadata", onReady, { once:true });
        video.addEventListener("error", onError, { once:true });
    });
}

function showPlaybackError(err){
    console.error(err);
    const message = document.getElementById("playbackError");
    message.textContent = err.name === "NotAllowedError"
        ? "Click the video to start playback."
        : err.message;
    message.style.display = "block";
}

function stepDuration(i=currentPage){
    return pages[i].reduce((total, clip) => total + clip.end - clip.start, 0);
}

/* Load one clip within a step, preserving the selected speed. */
async function loadClip(pageIndex, clipIndex, offset=0, shouldPlay=true){
    const requestId = ++loadRequest;
    loadingClip = true;
    const target = pages[pageIndex][clipIndex];
    currentPage = pageIndex;
    currentClip = clipIndex;
    pageNumber.innerText = `${currentPage + 1} / ${pages.length}`;
    document.getElementById("playbackError").style.display = "none";
    try {
        if(currentSrc !== target.src){
            currentSrc = target.src;
            video.src = target.src;
            video.load();
        }
        await waitForVideoReady();
        if(requestId !== loadRequest) return;
        if(target.start >= video.duration){
            throw new Error(`Step ${pageIndex + 1} starts past the end of ${target.src}. Check its times.`);
        }
        video.currentTime = target.start + offset;
        applyPlaybackSpeed();
        if(started && shouldPlay) await video.play();
    } catch(err){
        if(requestId === loadRequest) showPlaybackError(err);
    } finally {
        if(requestId === loadRequest) loadingClip = false;
    }
}

/* Load a step. A step can contain one clip or several clips. */
async function loadPage(i, direction=0){
    if(i < 0 || i >= pages.length) return;
    scrubbing = false;
    playBar.value = 0;
    if(direction !== 0){
        video.style.transform = `translateY(${direction * 100}%)`;
        setTimeout(() => video.style.transform = "translateY(0%)", 50);
    }
    await loadClip(i, 0);
}

function updateProgress(){
    if(!started || loadingClip) return;
    const clips = pages[currentPage];
    const target = clips[currentClip];
    if(!scrubbing){
        const elapsed = clips.slice(0, currentClip).reduce((total, clip) => total + clip.end - clip.start, 0)
            + Math.max(0, Math.min(target.end - target.start, video.currentTime - target.start));
        playBar.value = Math.max(0, Math.min(100, elapsed / stepDuration() * 100));
    }
    if(!scrubbing && (video.currentTime >= target.end || video.ended)){
        // Continue through this step's clips, then loop the whole step.
        loadClip(currentPage, (currentClip + 1) % clips.length);
    }
}
video.addEventListener("timeupdate", updateProgress);
video.addEventListener("ended", updateProgress);

/* Click overlay to start video */
overlay.addEventListener("click", async e => {
    e.stopPropagation();
    if(started) return;

    started = true;
    overlay.style.display = "none";

    playBar.style.opacity = "1";
    playBar.style.pointerEvents = "auto";
    heartBtn.style.opacity = "1";
    heartBtn.style.pointerEvents = "auto";
    snailBtn.style.opacity = "1";
    snailBtn.style.pointerEvents = "auto";

    video.muted = false;
    await loadPage(0);
});

/* Click page to pause/play */
page.addEventListener("click", () => {
    if(!started) return;
    video.paused
        ? video.play().then(() => { document.getElementById("playbackError").style.display = "none"; }).catch(showPlaybackError)
        : video.pause();
});

/* Scrub across the full step, including all of its clips. */
playBar.addEventListener("input", e => {
    e.stopPropagation();
    if(!started) return;
    scrubbing = true;
    const clips = pages[currentPage];
    let remaining = (playBar.value / 100) * stepDuration();
    let clipIndex = 0;
    while(clipIndex < clips.length - 1 && remaining >= clips[clipIndex].end - clips[clipIndex].start){
        remaining -= clips[clipIndex].end - clips[clipIndex].start;
        clipIndex++;
    }
    const target = clips[clipIndex];
    const offset = Math.min(remaining, Math.max(0, target.end - target.start - 0.01));
    if(clipIndex === currentClip && !loadingClip){
        video.currentTime = target.start + offset;
    } else {
        loadClip(currentPage, clipIndex, offset, !video.paused);
    }
});
playBar.addEventListener("change", e => {
    e.stopPropagation();
    scrubbing = false;
});
["click", "mousedown", "mouseup", "touchstart", "touchend"].forEach(type => {
    playBar.addEventListener(type, e => e.stopPropagation());
});

/* Toggle normal / half speed without pausing or changing steps. */
const snailBtn = document.getElementById("snailBtn");
let playbackSpeed = 1;
function applyPlaybackSpeed(){
    video.defaultPlaybackRate = playbackSpeed;
    video.playbackRate = playbackSpeed;
}
snailBtn.addEventListener("click", e => {
    e.stopPropagation();
    if(!started) return;
    playbackSpeed = playbackSpeed === 1 ? 0.5 : 1;
    applyPlaybackSpeed();
    snailBtn.setAttribute("aria-pressed", String(playbackSpeed === 0.5));
    snailBtn.setAttribute("aria-label", playbackSpeed === 0.5
        ? "Speed: 50%. Click for 100%." : "Speed: 100%. Click for 50%.");
    snailBtn.title = snailBtn.getAttribute("aria-label");
    snailBtn.querySelector(".speed-label").textContent = playbackSpeed === 0.5 ? "50%" : "100%";
});
// Keep gestures on this button from triggering page navigation.
["mousedown", "mouseup", "touchstart", "touchend"].forEach(type => {
    snailBtn.addEventListener(type, e => e.stopPropagation());
});
video.addEventListener("loadedmetadata", applyPlaybackSpeed);

/* Heart button animation */
heartBtn.addEventListener("click", e => {
    e.stopPropagation();
    heartBtn.classList.remove("heart-pulse");
    void heartBtn.offsetWidth;
    heartBtn.classList.add("heart-pulse");
});

/* Drag / swipe navigation */
page.addEventListener("mousedown", e => startY = e.clientY);
page.addEventListener("mouseup", e => {
    if(!started || startY === null) return;

    const diff = startY - e.clientY;
    startY = null;

    if(Math.abs(diff) > 60){
        diff < 0
            ? loadPage(currentPage + 1, -1)
            : loadPage(currentPage - 1, 1);
    }
});

page.addEventListener("touchstart", e => {
    startY = e.touches[0].clientY;
}, { passive:true });

page.addEventListener("touchend", e => {
    if(!started || startY === null) return;

    const diff = startY - e.changedTouches[0].clientY;
    startY = null;

    if(Math.abs(diff) > 50){
        diff < 0
            ? loadPage(currentPage + 1, -1)
            : loadPage(currentPage - 1, 1);
    }
});

/* Mouse wheel navigation */
page.addEventListener("wheel", e => {
    if(!started) return;

    e.deltaY < 0
        ? loadPage(currentPage + 1, -1)
        : loadPage(currentPage - 1, 1);
});

/* Preload the first video without starting playback */
pageNumber.innerText = `1 / ${pages.length}`;
video.src = pages[0][0].src;
currentSrc = pages[0][0].src;
video.load();
</script>
</body>
</html>
